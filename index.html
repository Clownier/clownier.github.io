<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clownier</title>
    <meta name="description" content="Clownier's personal homepage - Hello World!">
    <meta property="og:title" content="Clownier">
    <meta property="og:description" content="Clownier's personal homepage">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://clownier.github.io/">
    <meta name="theme-color" content="#0f0c29">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300d2ff'/%3E%3Cstop offset='100%25' stop-color='%233a7bd5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='bold' font-size='18' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="starfield"></canvas>

    <div id="weather">
        <span id="weatherIcon"></span>
        <span id="weatherTemp"></span>
        <span id="weatherDesc"></span>
    </div>

    <button id="themeToggle" onclick="toggleTheme()" title="切换主题">🌙</button>

    <div class="card">
        <h1>Clownier<span class="emoji">🌍</span></h1>
        <p class="subtitle"></p>
        <div class="social-links">
            <a href="https://github.com/Clownier" target="_blank" title="GitHub">🐙 GitHub</a>
        </div>
    </div>

    <div class="datetime">
        <span id="date"></span>
        <span> | </span>
        <span id="time"></span>
    </div>

    <div class="games-section">
        <div class="games-title">🎮 点击玩小游戏</div>
        <div class="game-buttons">
            <button class="game-btn btn-fireworks" onclick="startFireworks()">🎆 烟花</button>
            <button class="game-btn btn-bubble" onclick="startBubble()">🫧 泡泡</button>
            <button class="game-btn btn-reaction" onclick="startReaction()">⚡ 反应</button>
        </div>
    </div>

    <div class="game-container" id="gameContainer"></div>

    <div id="visitCount">👁️ 加载中...</div>

    <div class="footer-info">
        <div class="ip-location" id="ipLocation">📍 正在获取位置...</div>
        <span>v1.0.0</span>
    </div>

    <script src="js/games.js"></script>
    <script src="js/effects.js"></script>
</body>
</html>
