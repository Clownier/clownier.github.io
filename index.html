<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clownier</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card">
        <h1>Clownier<span class="emoji">🌍</span></h1>
        <p class="subtitle">Hello World!</p>
        <div class="social-links">
            <a href="https://github.com/Clownier" target="_blank" title="GitHub">🐙 GitHub</a>
        </div>
    </div>

    <div class="datetime">
        <span id="date"></span>
        <span> | </span>
        <span id="time"></span>
    </div>

    <div class="games-section">
        <div class="games-title">🎮 点击玩小游戏</div>
        <div class="game-buttons">
            <button class="game-btn btn-fireworks" onclick="startFireworks()">🎆 烟花</button>
            <button class="game-btn btn-bubble" onclick="startBubble()">🫧 泡泡</button>
            <button class="game-btn btn-reaction" onclick="startReaction()">⚡ 反应</button>
        </div>
    </div>

    <div class="game-container" id="gameContainer"></div>

    <div class="footer-info">
        <div class="ip-location" id="ipLocation">📍 正在获取位置...</div>
        <span>v1.0.0</span>
    </div>
    
    <script src="js/games.js"></script>
</body>
</html>
